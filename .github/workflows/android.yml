name: Android Release pruefen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Android SDK installieren
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Aufgaben, Audio und Datenschutz testen
        run: node --test tests/*.test.cjs
      - name: Release bauen und pruefen
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Kompilierte APK kontrollieren
        run: |
          python scripts/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk unsigned-security.json
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Paket fuer private Signierung vorbereiten
        run: |
          mkdir -p unsigned-release/tools/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned-release/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-release/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" unsigned-release/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" unsigned-release/tools/lib64/
          cp unsigned-security.json unsigned-release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Flink-Release-zum-Signieren
          path: unsigned-release/
      - name: Version ermitteln
        id: version
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r"versionName '([^']+)'",Path('app/build.gradle').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('name='+version+'\n')
              out.write('signed='+str(Path('downloads/Flink-Einmaleins-'+version+'.apk').exists()).lower()+'\n')
          PY
      - name: Signierte Weitergabeversion verifizieren
        if: steps.version.outputs.signed == 'true'
        run: |
          python scripts/verify_signed_candidate.py 'downloads/Flink-Einmaleins-${{ steps.version.outputs.name }}.apk' app/build/outputs/apk/release/app-release-unsigned.apk "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 'downloads/Flink-Einmaleins-${{ steps.version.outputs.name }}.apk'
          sha256sum 'downloads/Flink-Einmaleins-${{ steps.version.outputs.name }}.apk' > Flink-SHA256.txt
      - name: Gepruefte Version veroeffentlichen
        if: steps.version.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLINK_VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="v${FLINK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Diese Version ist bereits veroeffentlicht.'
          else
            gh release create "$tag" "downloads/Flink-Einmaleins-${FLINK_VERSION}.apk" Flink-Sicherheitspruefung.json Flink-SHA256.txt release/signing-certificate.pem --target "$GITHUB_SHA" --title "Flink Einmaleins ${FLINK_VERSION}" --notes-file RELEASE-NOTES.md
          fi
