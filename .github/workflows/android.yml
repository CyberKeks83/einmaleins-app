name: Android APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK installieren
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: APK bauen und pruefen
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: APK vorbereiten
        run: cp app/build/outputs/apk/debug/app-debug.apk Flink-Einmaleins.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Flink-Einmaleins-APK
          path: Flink-Einmaleins.apk
      - name: Download veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Flink-Einmaleins.apk --title 'Flink Einmaleins APK' --notes 'Android App mit 20 Aufgaben und Auswertung. APK herunterladen und auf Android installieren. Persönliche Testversion. Bei späteren Builds kann wegen einer neuen Testsignatur eine Neuinstallation nötig sein.'
